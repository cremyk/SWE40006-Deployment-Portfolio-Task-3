<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniGrocery Store - Cloud Deployment</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .hero { background: #198754; color: white; padding: 30px 0; margin-bottom: 25px; }
        .card { transition: transform 0.2s; }
        .card:hover { transform: translateY(-3px); }
    </style>
</head>
<body>

    <div class="hero text-center">
        <h2>MiniGrocery Store</h2>
        <p class="mb-1">SWE40006 Software Deployment - Task 3.1</p>
    </div>

    <div class="container mb-5">
        <div class="row">
            <!-- Product Catalog Column -->
            <div class="col-md-8">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h4>Fresh Catalogue</h4>
                    <!-- Category Filter Buttons -->
                    <div class="btn-group" role="group">
                        <button class="btn btn-outline-success btn-sm active" onclick="filterCategory('All')">All</button>
                        <button class="btn btn-outline-success btn-sm" onclick="filterCategory('Fruits')">Fruits</button>
                        <button class="btn btn-outline-success btn-sm" onclick="filterCategory('Dairy')">Dairy</button>
                        <button class="btn btn-outline-success btn-sm" onclick="filterCategory('Bakery')">Bakery</button>
                    </div>
                </div>

                <div class="row" id="product-grid">
                    <!-- Products will render here dynamically -->
                </div>
            </div>

            <!-- Shopping Cart Column -->
            <div class="col-md-4">
                <div class="card p-3 shadow-sm">
                    <h4>Shopping Cart</h4>
                    <hr>
                    <ul class="list-group mb-3" id="cart-list">
                        <li class="list-group-item text-muted text-center">Your cart is empty</li>
                    </ul>
                    <div class="d-flex justify-content-between fw-bold fs-5">
                        <span>Total:</span>
                        <span id="cart-total">RM 0.00</span>
                    </div>
                    <button class="btn btn-success mt-3 w-100" onclick="checkout()">Proceed to Checkout</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const products = [
            { id: 1, name: "Fresh Strawberries", price: 14.90, category: "Fruits", icon: "🍓" },
            { id: 2, name: "Organic Bananas", price: 6.50, category: "Fruits", icon: "🍌" },
            { id: 3, name: "Fresh Milk (1L)", price: 7.20, category: "Dairy", icon: "🥛" },
            { id: 4, name: "Cheddar Cheese", price: 12.50, category: "Dairy", icon: "🧀" },
            { id: 5, name: "Wholemeal Bread", price: 4.80, category: "Bakery", icon: "🍞" },
            { id: 6, name: "Butter Croissant", price: 5.50, category: "Bakery", icon: "🥐" }
        ];

        let cart = [];

        function renderProducts(items) {
            const grid = document.getElementById("product-grid");
            grid.innerHTML = items.map(p => `
                <div class="col-md-6 mb-3">
                    <div class="card h-100 shadow-sm">
                        <div class="card-body text-center">
                            <span style="font-size: 3rem;">${p.icon}</span>
                            <h5 class="card-title mt-2">${p.name}</h5>
                            <span class="badge bg-secondary mb-2">${p.category}</span>
                            <p class="text-success fw-bold fs-5">RM ${p.price.toFixed(2)}</p>
                            <button class="btn btn-sm btn-outline-success w-100" onclick="addToCart(${p.id})">+ Add to Cart</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function filterCategory(cat) {
            if (cat === 'All') renderProducts(products);
            else renderProducts(products.filter(p => p.category === cat));
        }

        function addToCart(id) {
            const prod = products.find(p => p.id === id);
            cart.push(prod);
            updateCartUI();
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCartUI();
        }

        function updateCartUI() {
            const cartList = document.getElementById("cart-list");
            const totalSpan = document.getElementById("cart-total");

            if (cart.length === 0) {
                cartList.innerHTML = `<li class="list-group-item text-muted text-center">Your cart is empty</li>`;
                totalSpan.innerText = "RM 0.00";
                return;
            }

            let total = 0;
            cartList.innerHTML = cart.map((item, idx) => {
                total += item.price;
                return `
                    <li class="list-group-item d-flex justify-content-between align-items-center">
                        <div>
                            <strong>${item.name}</strong><br>
                            <small class="text-muted">RM ${item.price.toFixed(2)}</small>
                        </div>
                        <button class="btn btn-danger btn-sm" onclick="removeFromCart(${idx})">✕</button>
                    </li>
                `;
            }).join('');

            totalSpan.innerText = "RM " + total.toFixed(2);
        }

        function checkout() {
            if (cart.length === 0) {
                alert("Your cart is empty! Add some items first.");
                return;
            }
            alert(`Order placed successfully! Total: ${document.getElementById("cart-total").innerText}\nThank you for shopping with MiniGrocery!`);
            cart = [];
            updateCartUI();
        }

        // Initial render
        renderProducts(products);
    </script>
</body>
</html>
